name: Release

# The PDFs live here, not in the repository. Push a tag (for example
# `git tag ss25 && git push origin ss25`) and every document is compiled from a
# clean checkout and attached to a GitHub release as a single zip.

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the PDFs under"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile every document
        uses: xu-cheng/latex-action@v3
        with:
          # The action needs a root file, so point it at the complete script
          # and let the script below do the full sweep in the same container.
          # work_in_root_file_dir is what makes that second, redundant compile
          # succeed: every document resolves \npbase relative to its own folder,
          # so it has to be built from there and not from the repository root.
          root_file: dokumente/skript/numprog_skript.tex
          working_directory: .
          work_in_root_file_dir: true
          pre_compile: |
            set -e
            # This runs inside the TeX Live image, which is Alpine: grep, find
            # and friends are BusyBox, not GNU. BusyBox grep has no --include,
            # so the sweep picks the .tex files with find and skips gemeinsam/
            # with a case statement. The discover job in build.yml may use GNU
            # grep for the same job -- it runs on the runner, not in here.
            mkdir -p "$GITHUB_WORKSPACE/release"
            build() {   # build <dir> <base> <jobname> [pretex]
              local dir=$1 base=$2 job=$3 pretex=${4:-}
              local args=(-pdf -interaction=nonstopmode -halt-on-error
                          -file-line-error -jobname="$job")
              [ -n "$pretex" ] && args+=(-usepretex="$pretex")
              ( cd "$dir" && latexmk "${args[@]}" "$base.tex" )
              cp "$dir/$job.pdf" \
                 "$GITHUB_WORKSPACE/release/$(echo "${dir#./}/$job" | tr '/' '_').pdf"
            }
            find . -type f -name '*.tex' | sort |
              while read -r doc; do
                case "$doc" in ./gemeinsam/*) continue ;; esac
                grep -q -F '\begin{document}' "$doc" || continue
                dir=$(dirname "$doc"); base=$(basename "$doc" .tex)
                echo "=== $doc"
                build "$dir" "$base" "$base"
                if grep -q 'ifdefined.npprint' "$doc"; then
                  build "$dir" "$base" "${base}_print" '\def\npprint{}'
                fi
              done

      - name: Collect the PDFs into one archive
        run: |
          # An empty release is a failure, not something to publish quietly.
          shopt -s nullglob
          pdfs=(release/*.pdf)
          printf '  %s\n' "${pdfs[@]}"
          if [ "${#pdfs[@]}" -eq 0 ]; then
            echo "::error::No PDFs were produced; nothing to release."
            exit 1
          fi

          # One archive instead of thirty assets: the release page stays
          # readable and the whole set can be grabbed in a single download.
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # Written outside release/ so the archive cannot pick itself up.
          mkdir -p dist
          # -j stores the PDFs flat, without the release/ directory around them.
          zip -j -9 "dist/numprog-pdfs-$tag.zip" "${pdfs[@]}"
          echo "${#pdfs[@]} PDFs archived in numprog-pdfs-$tag.zip."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
